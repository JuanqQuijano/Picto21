<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picto21 - Experimento B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <div class="barra-interior">
      <div class="marca">
        <div class="marca-icono" aria-hidden="true">🎴</div>
        <div class="marca-texto">
          <h1>Picto21</h1>
          <span>Aprender jugando</span>
        </div>
      </div>
      <div class="config" aria-label="Configuracion del terapeuta">
        <label class="control">
          <span>Escenario</span>
          <select id="sel-escenario"></select>
        </label>
        <label class="control">
          <span>Nivel</span>
          <select id="sel-nivel">
            <option value="1">1 - Elegir</option>
            <option value="2">2 - Letras</option>
            <option value="3">3 - Teclado</option>
          </select>
        </label>
        <button id="btn-nueva" class="btn-chico">Nueva ronda</button>
      </div>
    </div>
  </header>

  <main>
    <section class="marcadores" aria-label="Puntuacion">
      <div class="marcador jugador" aria-live="polite">
        <div class="marcador-cabecera">
          <span class="etiqueta">TU</span>
          <span id="suma-jugador" class="numero">0</span>
        </div>
        <div id="mano-jugador" class="mini-mano"></div>
      </div>
      <div class="meta">
        <span class="etiqueta">META</span>
        <span class="numero">21</span>
      </div>
      <div class="marcador crupier">
        <div class="marcador-cabecera">
          <span class="etiqueta">CRUPIER</span>
          <span id="suma-crupier" class="numero">0</span>
        </div>
        <div id="mano-crupier" class="mini-mano"></div>
      </div>
    </section>

    <section class="mesa">
      <div class="zona-carta">
        <div class="pregunta-panel">
          <div id="pregunta" class="frase" aria-live="polite"></div>
          <span id="intentos" class="indicador-intentos" aria-live="polite"></span>
          <button id="btn-audio" class="btn-audio" aria-label="Escuchar">🔊</button>
        </div>
        <div class="carta-grande" id="carta">
          <img id="carta-img" alt="">
          <span id="carta-emoji" class="emoji-respaldo" hidden></span>
        </div>
      </div>

      <div class="zona-respuesta">
        <div class="pistas-panel">
          <div class="pistas-cabecera">
            <span class="pistas-titulo">Pistas</span>
            <span class="pistas-subtitulo">Ayudas para adivinar</span>
          </div>
          <div id="pistas" class="frase pistas" aria-live="polite"></div>
        </div>
        <div id="respuesta" class="respuesta"></div>
      </div>

      <div class="zona-acciones">
        <div id="mensaje" class="mensaje" aria-live="assertive"></div>
        <section class="acciones">
          <button id="btn-pedir" class="btn-accion pedir">
            <img src="https://static.arasaac.org/pictograms/5441/5441_500.png" alt="">
            <span>PEDIR</span>
          </button>
          <button id="btn-parar" class="btn-accion parar">
            <img src="https://static.arasaac.org/pictograms/7195/7195_500.png" alt="">
            <span>PARAR</span>
          </button>
          <button id="btn-mejora" class="btn-accion mejora">
            <span id="mejora-emoji" class="emoji-mejora"></span>
            <span id="mejora-texto">MEJORA</span>
          </button>
        </section>
        <div id="consejo" class="consejo" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div id="fin-overlay" class="fin-overlay hidden" aria-live="polite">
    <div class="fin-card">
      <div class="fin-escena" aria-hidden="true"></div>
      <div class="fin-contenido">
        <h2 id="fin-titulo">¡Lo hiciste genial!</h2>
        <p id="fin-mensaje">La próxima ronda será todavía mejor.</p>
        <button id="btn-volver-jugar" class="btn-volver">Volver a jugar</button>
      </div>
    </div>
  </div>

  <footer>
    Pictogramas: Sergio Palao. Origen: <a href="https://arasaac.org">ARASAAC</a>.
    Licencia CC (BY-NC-SA). Propiedad: Gobierno de Aragon.
  </footer>

  <script src="datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
